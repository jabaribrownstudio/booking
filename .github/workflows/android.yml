name: Build Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace > ../build.log 2>&1
      - name: Publish APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk studio-admin.apk
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest studio-admin.apk --title "Studio Admin (Android)" --notes "Latest build. Download studio-admin.apk on your phone and install it."
      - name: Post build log
        if: always()
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          mkdir -p /tmp/log && cp build.log /tmp/log/build.log 2>/dev/null || echo "no log" > /tmp/log/build.log
          echo "${{ job.status }} $(date -u +%FT%TZ) ${{ github.sha }}" > /tmp/log/status.txt
          git checkout --orphan build-log
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/log/* .
          tail -c 60000 build.log > build.tail.log; mv build.tail.log build.log
          git add build.log status.txt
          git commit -m "build log" > /dev/null
          git push -f origin build-log
