name: Build Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build APKs
        working-directory: android
        env:
          APP_BUILD: ${{ github.run_number }}
        run: |
          # The release build is the fast one (not debuggable, optimised). The debug build is kept as a fallback.
          gradle assembleDebug --no-daemon --stacktrace > ../build.log 2>&1
          gradle assembleRelease --no-daemon --stacktrace >> ../build.log 2>&1 || echo "RELEASE BUILD FAILED" >> ../build.log
      - name: Publish APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk studio-admin.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk studio-admin.apk
          fi
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest studio-admin.apk --title "JB Studio Admin (build ${{ github.run_number }})" --notes "Build ${{ github.run_number }}. Download studio-admin.apk on your phone and install it over the old version."
      - name: Post build log
        if: always()
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          mkdir -p /tmp/log && cp build.log /tmp/log/build.log 2>/dev/null || echo "no log" > /tmp/log/build.log
          echo "${{ job.status }} $(date -u +%FT%TZ) ${{ github.sha }}" > /tmp/log/status.txt
          git checkout --orphan build-log
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/log/* .
          tail -c 60000 build.log > build.tail.log; mv build.tail.log build.log
          git add build.log status.txt
          git commit -m "build log" > /dev/null
          git push -f origin build-log
